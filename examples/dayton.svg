<text x="218.0" y="889.7" font-size="9.0" font-weight="bold">2a</text>
<text x="240.0" y="889.7" font-size="9.0">DEMON — Anagram: definition ‘devil’; anagram of DO + MEN (signalled by</text>
<text x="240.0" y="901.4" font-size="9.0">‘new’) gives DEMON</text>
<text x="218.0" y="917.1" font-size="9.0" font-weight="bold">5a</text>
<text x="240.0" y="917.1" font-size="9.0">SEA — Hidden word: definition ‘ocean’; SEA is hidden in ‘becauSE As’</text>
<text x="218.0" y="932.8" font-size="9.0" font-weight="bold">6a</text>
<text x="240.0" y="932.8" font-size="9.0">RAT — Reversal: definition ‘dirty dog’; TAR (‘sailor’) reversed (signalled by</text>
<text x="240.0" y="944.5" font-size="9.0">‘back’) gives RAT</text>
<text x="218.0" y="960.2" font-size="9.0" font-weight="bold">7a</text>
<text x="240.0" y="960.2" font-size="9.0">GOO — Deletion: definition ‘any thick, viscous matter’; GOOD (‘morality’) with D</text>
<text x="240.0" y="971.9" font-size="9.0">(‘penny’) taken off the end (signalled by ‘lacking’) leaves GOO</text>
<text x="218.0" y="987.6" font-size="9.0" font-weight="bold">8a</text>
<text x="240.0" y="987.6" font-size="9.0">ION — Anagram: definition ‘particle’; anagram of I + NO (signalled by ‘mangled’)</text>
<text x="240.0" y="999.3" font-size="9.0">gives ION</text>
